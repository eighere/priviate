name: daily-brief

on:
  schedule:
    # 08:00 KST = 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch: {}

# 외부 action을 쓰지 않음(저장소의 SHA 고정 정책 회피). 러너 기본 python3 사용.
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily brief
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID || '914fdb862eb24bae9d376ec228a428a5' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q yfinance
          python3 - <<'PYCODE'
          """
          경제·AI 아침 브리핑 — 클라우드 자동화 스크립트 (GitHub Actions 용)
          컴퓨터가 꺼져 있어도 GitHub 서버에서 매일 실행되어 Notion에 브리핑을 올린다.
          
          동작 흐름:
          1) yfinance로 마켓 스냅샷(종가) 수집
          2) Google News RSS로 당일 뉴스 헤드라인 수집
          3) LLM API(OpenAI 호환)로 뉴스 항목·요약 생성
          4) Notion API로 "경제·AI 아침 브리핑" DB에 페이지 생성
          
          필수 환경변수(시크릿):
          - NOTION_TOKEN   : Notion integration 내부 토큰 (secret_...)
          - LLM_API_KEY    : LLM API 키
          선택(기본값 있음):
          - NOTION_DB_ID   : 기본 "914fdb862eb24bae9d376ec228a428a5"
          - LLM_BASE_URL   : 기본 "https://api.deepseek.com"
          - LLM_MODEL      : 기본 "deepseek-chat"
          """
          
          import os
          import json
          import urllib.request
          import urllib.parse
          import datetime
          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo
          
          # ---------------------------------------------------------------- 설정
          NOTION_TOKEN = os.environ["NOTION_TOKEN"]
          NOTION_DB_ID = os.environ.get("NOTION_DB_ID", "914fdb862eb24bae9d376ec228a428a5")
          LLM_API_KEY = os.environ["LLM_API_KEY"]
          LLM_BASE_URL = os.environ.get("LLM_BASE_URL", "https://api.deepseek.com")
          LLM_MODEL = os.environ.get("LLM_MODEL", "deepseek-chat")
          
          KST = ZoneInfo("Asia/Seoul")
          
          # ---------------------------------------------------------------- 규칙서(요약)
          RULEBOOK = """너는 매일 아침 독자에게 전달되는 "경제 AI 뉴스 브리핑" 에디터다. 정확성 최우선. 지어낸 수치·사실 절대 금지.
          제공된 뉴스 헤드라인만 근거로 작성하고, 헤드라인에 없는 수치는 절대 만들지 마라.
          구조: summary(3개), sections(한국경제/세계경제/AI테크 각 3~5개 항목), schedule(오늘·가까운 일정), sources(언론사 목록).
          각 항목: {title, emoji, text, source, url}. emoji는 제목 맨 뒤. text는 1~2문장 친근한 구어체.
          각 섹션에 meaning(→ 그래서 핵심 인사이트 1문장).
          url은 해당 항목에 쓴 헤드라인의 url을 그대로 복사하고, 없으면 "" 로."""
          
          
          # ---------------------------------------------------------------- 1) 마켓 데이터
          def market_data():
              """yfinance로 전일 종가 수집. 실패하면 '-' 처리."""
              tickers = {
                  "코스피": "^KS11", "코스닥": "^KQ11", "원/달러": "KRW=X",
                  "나스닥": "^IXIC", "S&P500": "^GSPC", "다우": "^DJI",
                  "WTI": "CL=F", "브렌트": "BZ=F", "금": "GC=F", "비트코인": "BTC-USD",
              }
              rows = []
              try:
                  import yfinance as yf
                  for name, tk in tickers.items():
                      try:
                          df = yf.Ticker(tk).history(period="5d")
                          if df is None or df.empty:
                              rows.append([name, "-", "-"])
                              continue
                          prev = df["Close"].iloc[-2]
                          last = df["Close"].iloc[-1]
                          chg = (last - prev) / prev * 100
                          unit = "" if name in ("코스피", "코스닥", "나스닥", "S&P500", "다우") else ("원" if name == "원/달러" else "달러")
                          fmt = f"{last:,.2f}" if name not in ("원/달러",) else f"{last:,.1f}"
                          if name == "원/달러":
                              rows.append([name, f"{last:,.1f}원", f"{last-prev:+.1f}원"])
                          elif name == "비트코인":
                              rows.append([name, f"{last:,.0f}달러", f"{chg:+.2f}%"])
                          else:
                              rows.append([name, f"{last:,.2f}달러" if unit == "달러" else f"{last:,.2f}", f"{chg:+.2f}%"])
                      except Exception:
                          rows.append([name, "-", "-"])
              except Exception:
                  rows = [[n, "-", "-"] for n in tickers]
              # 국고채는 yfinance로 못 구하므로 '-' 처리
              rows.insert(3, ["국고채 3년", "-", "-"])
              rows.insert(4, ["국고채 10년", "-", "-"])
              return rows
          
          
          # ---------------------------------------------------------------- 2) 뉴스 수집
          def fetch_news(query, n=12):
              url = ("https://news.google.com/rss/search?q=" + urllib.parse.quote(query) +
                     "&hl=ko&gl=KR&ceid=KR:ko")
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=30).read()
              root = ET.fromstring(data)
              out = []
              for item in root.findall(".//item")[:n]:
                  title = item.findtext("title") or ""
                  link = item.findtext("link") or ""
                  source = item.findtext("source") or ""
                  out.append({"title": title, "source": source, "url": link})
              return out
          
          
          # ---------------------------------------------------------------- 3) LLM 호출
          def llm_brief(news, date_label):
              payload = {
                  "model": LLM_MODEL,
                  "messages": [
                      {"role": "system", "content": RULEBOOK},
                      {"role": "user", "content":
                          f"오늘 날짜: {date_label}\n\n"
                          f"뉴스 헤드라인:\n" +
                          "\n".join(f"- [{h['source']}] {h['title']}\n  url: {h['url']}" for h in news) +
                          "\n\n위 헤드라인만 근거로 JSON을 출력하라. 다른 설명 없이 JSON만. "
                          "형식: {\"summary\":[...], \"sections\":[{\"name\":\"한국경제\",\"items\":[{title,emoji,text,source,url}],\"meaning\":\"\"}...], \"schedule\":[...], \"sources\":\"...\"}"},
                  ],
                  "temperature": 0.3,
              }
              req = urllib.request.Request(
                  LLM_BASE_URL.rstrip("/") + "/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Authorization": "Bearer " + LLM_API_KEY},
              )
              resp = json.loads(urllib.request.urlopen(req, timeout=120).read())
              content = resp["choices"][0]["message"]["content"]
              content = content.strip()
              if content.startswith("```"):
                  content = content.strip("`")
                  if content.startswith("json"):
                      content = content[4:]
              start = content.find("{")
              end = content.rfind("}")
              return json.loads(content[start:end + 1])
          
          
          # ---------------------------------------------------------------- 4) Notion 블록 빌드
          def rt(text, bold=False, link=None):
              r = {"type": "text", "text": {"content": text}}
              if bold:
                  r["annotations"] = {"bold": True}
              if link:
                  r["text"]["link"] = {"url": link}
              return r
          
          
          def p_block(*rich_texts):
              return {"object": "block", "type": "paragraph",
                      "paragraph": {"rich_text": list(rich_texts)}}
          
          
          def h2(text):
              return {"object": "block", "type": "heading_2",
                      "heading_2": {"rich_text": [rt(text)]}}
          
          
          def bullet(text):
              return {"object": "block", "type": "bulleted_list_item",
                      "bulleted_list_item": {"rich_text": [rt(text)]}}
          
          
          def table_block(market):
              rows = market["rows"]
              header = ["지표", "종가", "전일대비"]
              children = []
              for r in [header] + rows:
                  cells = []
                  for c in r:
                      cells.append([{"type": "text", "text": {"content": str(c)}}])
                  children.append({"type": "table_row",
                                   "table_row": {"cells": cells}})
              return {"object": "block", "type": "table", "table": {
                  "table_width": 3, "has_column_header": True, "has_row_header": False,
                  "children": children}}
          
          
          def blocks_from_brief(brief, market_rows, date_label):
              blocks = []
              # 오늘의 흐름 (제목은 페이지 title로, 날짜는 heading2로)
              blocks.append(h2("오늘의 흐름 — " + date_label))
              blocks.append(h2("마켓 스냅샷"))
              blocks.append(table_block({"rows": market_rows}))
              blocks.append(h2("한눈에 보는 오늘"))
              for s in brief.get("summary", []):
                  blocks.append(bullet(s))
              for sec in brief.get("sections", []):
                  blocks.append(h2(sec.get("name", "")))
                  for it in sec.get("items", []):
                      title = it.get("title", "")
                      emoji = it.get("emoji", "")
                      blocks.append(p_block(rt((title + " " + emoji).strip(), bold=True)))
                      blocks.append(p_block(rt(it.get("text", ""))))
                      src, url = it.get("source", ""), it.get("url", "")
                      if src:
                          blocks.append(p_block(rt("출처: "), rt(src, link=url or None)))
                  blocks.append(p_block(rt("→ 그래서: ", bold=True), rt(sec.get("meaning", ""))))
              sch = brief.get("schedule", [])
              if sch:
                  blocks.append(h2("오늘의 일정"))
                  for line in sch:
                      blocks.append(bullet(line))
              if brief.get("sources"):
                  blocks.append(h2("출처"))
                  blocks.append(p_block(rt(brief["sources"])))
              blocks.append(p_block(rt("본 브리핑은 정보 제공 목적이며 투자 권유가 아님.")))
              return blocks
          
          
          # ---------------------------------------------------------------- 5) Notion 업로드
          def post_to_notion(title, date_iso, blocks):
              body = {
                  "parent": {"database_id": NOTION_DB_ID},
                  "properties": {
                      "이름": {"title": [{"text": {"content": title}}]},
                      "날짜": {"date": {"start": date_iso}},
                  },
                  "children": blocks,
              }
              req = urllib.request.Request(
                  "https://api.notion.com/v1/pages",
                  data=json.dumps(body).encode("utf-8"),
                  headers={
                      "Authorization": "Bearer " + NOTION_TOKEN,
                      "Content-Type": "application/json",
                      "Notion-Version": "2022-06-28",
                  },
              )
              resp = json.loads(urllib.request.urlopen(req, timeout=60).read())
              return resp.get("url", "")
          
          
          # ---------------------------------------------------------------- main
          def main():
              now = datetime.datetime.now(KST)
              date_iso = now.strftime("%Y-%m-%d")
              date_label = now.strftime("%Y년 %m월 %d일") + " (" + "월화수목금토일"[now.weekday()] + "요일)"
          
              print("[1/4] 마켓 데이터 수집")
              market_rows = market_data()
          
              print("[2/4] 뉴스 수집")
              news = []
              for q in ["한국 경제", "세계 경제", "AI 인공지능", "코스피 증시"]:
                  try:
                      news += fetch_news(q)
                  except Exception as e:
                      print("  RSS 실패:", q, e)
          
              print("[3/4] LLM 브리핑 생성")
              brief = llm_brief(news, date_label)
          
              print("[4/4] Notion 업로드")
              blocks = blocks_from_brief(brief, market_rows, date_label)
              url = post_to_notion(date_iso + " 아침 브리핑", date_iso, blocks)
              print("DONE:", url)
          
          
          if __name__ == "__main__":
              main()
          PYCODE
